title: Phiếu cho buổi hẹn của tôi
seo_title: "Phiếu cho buổi hẹn: cho chuyên viên trị liệu biết chỗ đau | Mobility PT"
description: Trả lời vài câu hỏi bằng tiếng Việt, rồi in hoặc đưa ra một phiếu bằng tiếng Anh và tiếng Việt cho buổi vật lý trị liệu.
intro: Quý vị trả lời vài câu hỏi bằng tiếng Việt. Chúng tôi làm một phiếu bằng tiếng Anh và tiếng Việt để quý vị in ra hoặc đưa xem khi đến hẹn.
privacy: Riêng tư. Câu trả lời chỉ nằm trên điện thoại hoặc máy tính của quý vị. Không có gì được gửi cho chúng tôi hay được lưu lại.
name_label: Tên của quý vị (không bắt buộc)
areas_label: Quý vị đau ở đâu? Chạm vào tất cả chỗ đau.
other_area: Chỗ khác
