  links: [joint-pain-sprains-strains, post-surgery-rehab, work-injuries]
- key: hip
  name: Hip
  view: front
  x: 40
  y: 47
  common:
    - Hip pain
    - Recovery after a hip replacement
  links: [joint-pain-sprains-strains, post-surgery-rehab]
- key: knee
  name: Knee
  view: front
  x: 40
  y: 69
  common:
    - Knee pain, including pain around the kneecap
