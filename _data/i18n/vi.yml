bm_title: Quý vị đau ở đâu?
bm_seo: "Quý Vị Đau Ở Đâu? Tìm Dịch Vụ Vật Lý Trị Liệu Phù Hợp | Mobility PT"
bm_desc: Chạm vào chỗ đau để xem các chuyên viên vật lý trị liệu của chúng tôi ở Tustin và Lake Forest có thể giúp gì, rồi đặt hẹn hoặc gọi điện.
bm_intro: Xin chạm vào chỗ làm quý vị khó chịu. Chúng tôi sẽ cho quý vị biết chúng tôi có thể giúp gì và cách bắt đầu.
bm_front: Mặt trước
bm_back: Mặt sau
bm_list_label: Hoặc chọn từ danh sách
bm_start: Chạm vào một chỗ trên cơ thể, hoặc chọn từ danh sách, để xem chúng tôi có thể giúp gì.
bm_common: Mọi người thường đến với chúng tôi vì
bm_learn: Tìm hiểu thêm
bm_book: Đặt hẹn khám
bm_not_sure: Chưa chắc chắn, hoặc đau ở nhiều chỗ? Xin gọi cho chúng tôi, chúng tôi sẽ giúp quý vị biết bước tiếp theo.
bm_safety: "Trang này chỉ là thông tin chung, không phải là chẩn đoán. Nếu cơn đau xảy ra đột ngột hoặc rất nặng, hoặc do té ngã hay tai nạn, xin đi khám bác sĩ trước. Trong trường hợp khẩn cấp, xin gọi 911."
bm_tile_sub: Chạm vào chỗ đau, xem chúng tôi giúp thế nào
